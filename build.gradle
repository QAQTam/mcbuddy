plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings line: MC 26.3 jars ship unobfuscated (no ProGuard mappings are
	// published anymore), and Loom 1.18+ supports mapping-less unobfuscated builds.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Fixed dev identity: the real player keeps the same name/uuid across launches
// (Loom otherwise randomizes "Player###" every runClient, so worlds forget you).
loom {
	runs {
		client {
			programArgs '--username', 'tsy3m'
			programArgs '--uuid', '0a23e6f3-58f2-3f8c-84c6-7976fb305de4'
		}
	}
}

jar {
	from('LICENSE')
}
